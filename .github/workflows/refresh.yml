name: Refresh the merged-PR ledger

on:
  schedule:
    - cron: "23 4 * * *" # daily at 04:23 UTC (off the hour: top-of-hour schedules queue longest)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add newly merged PRs and redraw the cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python assets/update.py
          python assets/build.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git commit -m "Refresh the merged-PR ledger"
          git push
