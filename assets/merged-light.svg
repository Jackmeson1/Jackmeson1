  <title id="t">What got merged</title>
  <desc id="d">63 merged upstream pull requests, 36 of them 100 or more changed lines. By area:
    multimodal models 11; tooling &amp; libraries 8; orchestration 7; storage &amp; downloads 7; deployment config 6; gateway &amp; routing 6; inference engines 5; streaming &amp; requests 5; autoscaling 4; batch API 3; image &amp; video 1. 2 were release regressions found by bisecting.
